- name: ec2 instace management
  hosts: local
  connection: local
  vars:
    instances: [ "mongodb", "redis", "mysql", "rabbitmq" ]
    image_id: ami-0055977a6e828a4f4
    #domain_name: devops90s.shop
    #action: create
  tasks: 
   - name: create ec2 instances
     amazon.aws.ec2_instance:
      instances_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      region: us-east-1
      security_group:
      - "roboshp-{{ item }}"
      - roboshop-common 
  loop: "{{ instamnces }}"
  register: ec2-output
  #when: action == "create"