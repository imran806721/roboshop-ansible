- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    image_id: ami-0055977a6e828a4f4
    domain_name: devops90s.shop # replace with your domain
    action: create
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      region: us-east-1
      security_groups:
      - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

# - name: print output
#   debug:
#     msg: "{{ ec2_output }}"

- name: Create Route53 records
  amazon.aws.route53:
    state: present
    zone: devops90s.shop
    record: "{{ item.item }}.devops90s.shop"
    type: A
    ttl: 1
    value: "{{ item.instances[0].private_ip_address }}"
    overwrite: true
  loop: "{{ ec2_output.results }}"
  when: action == "create"

